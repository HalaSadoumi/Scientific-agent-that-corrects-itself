[[package]]
name = "astro-agent"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "boto3" },
    { name = "fastapi" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pymupdf" },
    { name = "python-docx" },
    { name = "python-multipart" },
    { name = "redis" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
astro-embeddings = [
    { name = "sentence-transformers" },
]
graph = [
    { name = "neo4j" },
]

[package.dev-dependencies]
dev = [
    { name = "httpx" },
    { name = "mypy" },
    { name = "pre-commit" },
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "boto3", specifier = ">=1.35" },
    { name = "fastapi", specifier = ">=0.115" },
    { name = "neo4j", marker = "extra == 'graph'", specifier = ">=5.25,<7" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.2" },
    { name = "pydantic", specifier = ">=2.8" },
    { name = "pydantic-settings", specifier = ">=2.4" },
    { name = "pymupdf", specifier = ">=1.24" },
    { name = "python-docx", specifier = ">=1.1" },
    { name = "python-multipart", specifier = ">=0.0.9" },
    { name = "redis", specifier = ">=5.0" },
    { name = "sentence-transformers", marker = "extra == 'astro-embeddings'", specifier = ">=3.3,<6" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.30" },
]
provides-extras = ["astro-embeddings", "graph"]

[package.metadata.requires-dev]
dev = [
    { name = "httpx", specifier = ">=0.27" },
    { name = "mypy", specifier = ">=1.11" },
    { name = "pre-commit", specifier = ">=3.8" },
